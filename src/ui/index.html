<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex • Computer Use</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    
    <!-- ── 1. Far-Left Icon Rail ───────────────────────────────── -->
    <aside class="icon-rail">
      <div class="rail-top-icons">
        <!-- Home Button -->
        <button class="rail-btn active" title="Home" id="btn-nav-home">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>

        <!-- History Button -->
        <button class="rail-btn" title="History">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>

        <!-- Library / Docs -->
        <button class="rail-btn" title="Library">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>

        <!-- Chat / Comments -->
        <button class="rail-btn" title="Chat">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>

        <!-- Mention / Community -->
        <button class="rail-btn" title="Mentions">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
        </button>

        <!-- More Dots -->
        <button class="rail-btn" title="More">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>

        <!-- Settings / Sliders -->
        <button class="rail-btn" title="Settings" id="btn-open-settings">
          <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
      </div>

      <div class="rail-bottom-icons">
        <!-- Download Pill -->
        <div class="download-badge" title="Downloads & Updates">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>

        <!-- User Avatar -->
        <div class="avatar-badge" title="User Profile">AY</div>

        <!-- Progress Indicator -->
        <div class="progress-pill" title="Getting Started">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
      </div>
    </aside>

    <!-- ── 2. Sidebar Navigation Panel ────────────────────────── -->
    <nav class="sidebar-panel">
      <div class="sidebar-header">
        <div class="codex-dropdown" id="dropdown-header">
          <span>Codex</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="header-icons">
          <!-- Notification Bell -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <!-- Search Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
      </div>

      <!-- New Chat Button -->
      <button class="new-chat-btn" id="btn-new-chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span>New chat</span>
      </button>

      <!-- Projects Section -->
      <div class="sidebar-section-title">Projects</div>
      <div class="sidebar-item empty">No projects</div>

      <!-- Recents Section -->
      <div class="sidebar-section-title">Recents</div>
      <div class="recents-list" id="recents-list">
        <!-- Dynamically populated from actual chat history -->
      </div>
    </nav>

    <!-- ── 3. Main Chat Viewport ──────────────────────────────── -->
    <main class="main-viewport">
      <!-- Top Navigation Header -->
      <header class="viewport-topbar">
        <div class="topbar-nav">
          <!-- Back arrow -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          <!-- Forward arrow -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          <!-- Sidebar / layout icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </div>

        <div class="topbar-actions">
          <!-- Get Plus Pill -->
          <button class="get-plus-btn" id="btn-get-plus" title="Configure Groq API Key">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
            <span>Get Plus</span>
          </button>

          <!-- New Tab + -->
          <div class="new-tab-btn" id="btn-new-tab" title="New Tab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
      </header>

      <!-- Chat Stream Area -->
      <div class="chat-stream-container" id="chat-stream">
        <!-- Hero Centered Start Screen -->
        <div class="hero-container" id="hero-state">
          <!-- Cloud with >_ inside -->
          <svg class="hero-cloud-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor">
            <!-- Cloud Outline -->
            <path d="M18 46h28a14 14 0 0 0 3-27.6A18 18 0 0 0 17 22 12 12 0 0 0 18 46z"/>
            <!-- Terminal Prompt >_ -->
            <polyline points="26 31 31 35 26 39" stroke-width="2"/>
            <line x1="34" y1="39" x2="40" y2="39" stroke-width="2"/>
          </svg>
          <div class="hero-title">What should we build?</div>
        </div>

        <!-- Dynamic Messages Flow Here -->
        <div id="messages-list"></div>
      </div>

      <!-- ── 4. Bottom Floating Input Capsule ─────────────────── -->
      <div class="floating-capsule-wrapper">
        <div class="floating-input-capsule">
          
          <!-- Top Row inside Capsule: Choose Project / Device -->
          <div class="capsule-top-row">
            <button class="project-pill" id="btn-choose-device" title="Target Device">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span id="device-label">Choose project</span>
            </button>
          </div>

          <!-- Main Text Input Field -->
          <textarea
            class="capsule-input"
            id="prompt-input"
            rows="1"
            placeholder="Do anything"
            autocomplete="off"
            autofocus
          ></textarea>

          <!-- Bottom Toolbar inside Capsule -->
          <div class="capsule-bottom-bar">
            <div class="capsule-left-actions">
              <!-- Add (+) button -->
              <button class="tool-icon-btn" title="Add action / screenshot" id="btn-add-action">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>

              <!-- Approve for me toggle -->
              <div class="approve-pill" id="btn-approve-toggle" title="Auto-Approve Actions">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Approve for me</span>
              </div>
            </div>

            <div class="capsule-right-actions">
              <!-- Model Selector (Luna Medium / Llama 3.3) -->
              <div class="model-selector" id="btn-model-selector" title="Switch Model or Groq Key">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                <span id="model-name-label">Luna Medium ⌵</span>
              </div>

              <!-- Microphone Icon -->
              <button class="tool-icon-btn" title="Voice Input">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </button>

              <!-- Send Button (Up Arrow inside circle) -->
              <button class="send-circle-btn" id="btn-send" title="Send (Enter)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              </button>
            </div>
          </div>

        </div>
      </div>

    </main>

  </div>

  <!-- ── 5. Modal for API Key & Settings ──────────────────────── -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-card">
      <div class="modal-title">Groq AI & Model Settings</div>
      <div class="modal-desc">
        Configure your Groq API key (<code>gsk_...</code>) to power the assistant with high-speed Llama 3.3 70B reasoning:
      </div>
      <input type="password" class="modal-input" id="groq-key-input" placeholder="gsk_..." />
      
      <div class="modal-title" style="font-size: 14px; margin-top: 10px;">Target Device</div>
      <div style="margin-bottom: 16px;">
        <select class="modal-input" id="device-select-dropdown" style="margin-bottom: 0;">
          <option value="mac-primary">💻 Mac Primary Display (mac-primary)</option>
          <option value="android-primary">📱 Android Tablet / Phone</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="modal-btn cancel" id="btn-cancel-modal">Cancel</button>
        <button class="modal-btn save" id="btn-save-modal">Save Settings</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
